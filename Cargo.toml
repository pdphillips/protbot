[package]
name = "protbot"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Stdio MCP server for one Proton account, with no secrets on disk"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.2", default-features = false, features = ["ring", "tls12"] }
toml = "=0.8.23"

[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
